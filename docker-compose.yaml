services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  provision:
    build:
      context: .
      target: worker
    command: ["sh", "-c", "node_modules/.bin/tsx db/provision.ts; echo PROVISION_EXIT=$?; sleep 600"]
    restart: unless-stopped
    environment:
      DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN}
      APP_DB_ROLE_NAME: ${APP_DB_ROLE_NAME}
      APP_DB_ROLE_PASSWORD: ${APP_DB_ROLE_PASSWORD}
      DEMO_EMAIL: ${DEMO_EMAIL}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
